[project]
name = "tacktab-homeassistant"
version = "1.0.0"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
  "homeassistant==2026.10.2",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "gazetteer-matcher==1.1.0",
  "ha-ffmpeg==3.2.2",
  "pymicro-vad==1.0.1",
  "pyspeex-noise==1.0.2",
  "mutagen==1.48.1",
  "pytest-homeassistant-custom-component==0.13.373",
  "jsonschema==4.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
